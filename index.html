<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arcane Dice Roller</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #07090e;
      --card-bg: rgba(14, 18, 27, 0.85);
      --gold: #f59e0b;
      --gold-glow: rgba(245, 158, 11, 0.45);
      --crit-glow: rgba(234, 179, 8, 0.7);
      --fumble-glow: rgba(239, 68, 68, 0.7);
      --explode-glow: rgba(249, 115, 22, 0.85);
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(120, 53, 15, 0.18) 0%, transparent 60%),
        radial-gradient(circle at 10% 90%, rgba(30, 27, 75, 0.25) 0%, transparent 50%),
        radial-gradient(circle at 90% 85%, rgba(69, 10, 10, 0.2) 0%, transparent 50%),
        url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23ffffff' fill-opacity='0.02' fill-rule='evenodd'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/svg%3E");
    }

    .font-cinzel {
      font-family: 'Cinzel', serif;
    }

    .font-mono-num {
      font-family: 'JetBrains Mono', monospace;
    }

    /* Subtle geometric mesh pattern for result stage */
    .bg-mesh-pattern {
      background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px),
                        radial-gradient(rgba(245, 158, 11, 0.05) 1px, transparent 1px);
      background-size: 18px 18px;
      background-position: 0 0, 9px 9px;
    }

    /* Ambient glassmorphic card */
    .glass-panel {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 25px rgba(245, 158, 11, 0.06);
    }

    /* Dice button micro-interactions */
    .dice-btn {
      position: relative;
      background: linear-gradient(145deg, rgba(26, 32, 46, 0.95), rgba(15, 19, 29, 0.98));
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      overflow: hidden;
    }

    .dice-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, var(--btn-glow, rgba(245, 158, 11, 0.2)) 0%, transparent 70%);
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .dice-btn:hover {
      transform: translateY(-2px);
      border-color: rgba(245, 158, 11, 0.4);
      box-shadow: 0 8px 20px -4px rgba(0, 0, 0, 0.6), 0 0 14px var(--btn-glow, rgba(245, 158, 11, 0.25));
    }

    .dice-btn:hover::before {
      opacity: 1;
    }

    .dice-btn:active {
      transform: scale(0.96) translateY(0);
    }

    .dice-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none !important;
    }

    /* Shake Animations */
    @keyframes screenShake {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      15% { transform: translate(-6px, 3px) rotate(-1.5deg); }
      30% { transform: translate(5px, -4px) rotate(1.2deg); }
      45% { transform: translate(-5px, -2px) rotate(-1deg); }
      60% { transform: translate(6px, 3px) rotate(1deg); }
      75% { transform: translate(-3px, 2px) rotate(-0.5deg); }
    }

    @keyframes diceJitter {
      0%, 100% { transform: translate(0, 0) scale(1); }
      20% { transform: translate(-3px, 2px) scale(1.04); }
      40% { transform: translate(3px, -2px) scale(0.97); }
      60% { transform: translate(-2px, -3px) scale(1.03); }
      80% { transform: translate(2px, 3px) scale(0.98); }
    }

    .animate-shake {
      animation: screenShake 0.45s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }

    .animate-jitter {
      animation: diceJitter 0.1s infinite;
    }

    @keyframes badgePop {
      0% { transform: scale(0.6) translateY(8px); opacity: 0; }
      70% { transform: scale(1.08) translateY(-2px); opacity: 1; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }

    .animate-badge-pop {
      animation: badgePop 0.35s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
    }

    @keyframes goldPulse {
      0%, 100% { box-shadow: 0 0 35px rgba(245, 158, 11, 0.5), inset 0 0 20px rgba(245, 158, 11, 0.25); }
      50% { box-shadow: 0 0 65px rgba(251, 191, 36, 0.85), inset 0 0 35px rgba(251, 191, 36, 0.5); }
    }

    @keyframes bloodPulse {
      0%, 100% { box-shadow: 0 0 35px rgba(220, 38, 38, 0.6), inset 0 0 25px rgba(220, 38, 38, 0.4); }
      50% { box-shadow: 0 0 70px rgba(239, 68, 68, 0.95), inset 0 0 40px rgba(239, 68, 68, 0.65); }
    }

    @keyframes explosionPulse {
      0% { box-shadow: 0 0 25px rgba(249, 115, 22, 0.6), inset 0 0 15px rgba(234, 88, 12, 0.4); }
      50% { box-shadow: 0 0 85px rgba(251, 146, 60, 0.95), inset 0 0 45px rgba(249, 115, 22, 0.75); }
      100% { box-shadow: 0 0 35px rgba(249, 115, 22, 0.6), inset 0 0 20px rgba(234, 88, 12, 0.4); }
    }

    .crit-glow-active {
      animation: goldPulse 1.5s infinite alternate;
      border-color: rgba(245, 158, 11, 0.9) !important;
    }

    .fumble-glow-active {
      animation: bloodPulse 1.2s infinite alternate;
      border-color: rgba(239, 68, 68, 0.9) !important;
    }

    .explode-glow-active {
      animation: explosionPulse 1.1s infinite alternate;
      border-color: rgba(249, 115, 22, 0.9) !important;
    }

    .shockwave {
      position: absolute;
      border-radius: 9999px;
      pointer-events: none;
      border: 3px solid rgba(249, 115, 22, 0.9);
      animation: shockwaveExpand 0.75s cubic-bezier(0.1, 0.7, 0.1, 1) forwards;
    }

    @keyframes shockwaveExpand {
      0% { width: 10px; height: 10px; opacity: 1; transform: translate(-50%, -50%) scale(1); }
      100% { width: 450px; height: 450px; opacity: 0; transform: translate(-50%, -50%) scale(1.6); border-width: 1px; }
    }

    #fx-canvas {
      pointer-events: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 50;
    }
  </style>
</head>

<body class="min-h-screen text-slate-100 flex flex-col items-center justify-center p-3 sm:p-6 select-none relative overflow-x-hidden">
  
  <canvas id="fx-canvas"></canvas>

  <!-- Ambient Backdrop Lights -->
  <div id="ambient-glow" class="fixed inset-0 pointer-events-none transition-all duration-700 opacity-20 -z-10"></div>

  <main id="app-wrapper" class="w-full max-w-md mx-auto relative z-10 transition-transform duration-300">
    
    <!-- Header with Sound Switch and Exploding Switch -->
    <header class="flex items-center justify-between px-1 mb-3 gap-2">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-lg bg-amber-500/10 border border-amber-500/30 flex items-center justify-center text-amber-400 shrink-0 shadow-[0_0_12px_rgba(245,158,11,0.15)] overflow-hidden">
          <!-- Isometric d6 with top face painted solid yellow -->
          <svg class="w-5 h-5 drop-shadow-[0_0_6px_rgba(234,179,8,0.5)]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <!-- Top Face: Fully painted vibrant yellow -->
            <polygon points="12 2.8 20.8 7.9 12 13 3.2 7.9" fill="#eab308" stroke="#fef08a" stroke-width="1.3"/>
            <!-- Left Face: Dark translucent facade with pips -->
            <polygon points="3.2 7.9 12 13 12 21.6 3.2 16.5" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1.2"/>
            <!-- Right Face: Deep slate facade with pips -->
            <polygon points="12 13 20.8 7.9 20.8 16.5 12 21.6" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1.2"/>
            <!-- Subtle pips on side faces -->
            <circle cx="7.6" cy="14.5" r="0.9" fill="rgba(253, 230, 138, 0.7)"/>
            <circle cx="16.4" cy="14.5" r="0.9" fill="rgba(253, 230, 138, 0.7)"/>
            <circle cx="14.6" cy="11.8" r="0.9" fill="rgba(253, 230, 138, 0.7)"/>
            <circle cx="18.2" cy="17.2" r="0.9" fill="rgba(253, 230, 138, 0.7)"/>
          </svg>
        </div>
        <h1 class="text-base sm:text-lg font-cinzel font-extrabold tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-amber-200 via-amber-400 to-yellow-500 whitespace-nowrap">
          Aram's Roller
        </h1>
      </div>

      <!-- Control Toggles -->
      <div class="flex items-center gap-1.5 shrink-0">
        <!-- Exploding Dice Toggle -->
        <button id="explode-toggle" class="px-2.5 py-1.5 rounded-lg border text-xs font-mono-num flex items-center gap-1.5 transition border-slate-700/60 bg-slate-900/80 text-slate-400 hover:text-white hover:border-orange-500/40" title="Activar/Desactivar dados explosivos">
          <span class="text-sm">💥</span>
          <span id="explode-text" class="text-[10px] font-bold tracking-wider text-slate-400">EXP OFF</span>
        </button>

        <!-- Sound Toggle -->
        <button id="sound-toggle" class="px-2.5 py-1.5 rounded-lg bg-slate-800/80 hover:bg-slate-700/80 border border-slate-700/60 text-xs font-mono-num flex items-center gap-1.5 transition text-slate-300 hover:text-white" title="Alternar audio">
          <span id="sound-icon">🔊</span>
          <span id="sound-text" class="text-[10px] font-bold tracking-wider">ON</span>
        </button>
      </div>
    </header>

    <!-- Main Glass Panel -->
    <div class="glass-panel rounded-2xl p-5 border border-slate-800/80 flex flex-col gap-5 relative">
      
      <!-- Display Screen (Center Result Stage) -->
      <section id="result-stage" class="relative rounded-xl border border-slate-700/50 bg-slate-950/80 p-5 min-h-[185px] flex flex-col items-center justify-center transition-all duration-300 overflow-hidden">
        
        <!-- Subtle geometric mesh texture -->
        <div class="absolute inset-0 bg-mesh-pattern opacity-60 pointer-events-none"></div>

        <!-- Rolling State / Dice Name Label -->
        <div id="dice-type-tag" class="text-[11px] font-cinzel font-bold tracking-widest text-slate-400 uppercase mb-1 z-10 transition-colors">
          ELIGE UN DADO
        </div>

        <!-- Big Central Number -->
        <div id="result-number" class="text-6xl sm:text-7xl font-mono-num font-black tracking-tight text-white transition-all duration-150 transform z-10">
          --
        </div>

        <!-- Subtext Breakdown for 2d6 and explosions -->
        <div id="result-breakdown" class="text-xs font-mono-num text-slate-300 mt-2 min-h-[20px] opacity-0 transition-opacity z-10 text-center px-2 max-w-full break-words">
          &nbsp;
        </div>

        <!-- Quick reroll button -->
        <button id="quick-reroll" class="absolute bottom-2 right-2 text-xs text-slate-500 hover:text-amber-400 p-1.5 rounded-md hover:bg-slate-800/60 transition opacity-0 pointer-events-none z-10" title="Volver a tirar este dado">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
          </svg>
        </button>
      </section>

      <!-- Dice Selector Grid -->
      <section>
        <div class="flex items-center justify-between mb-2.5 px-0.5">
          <span class="text-[11px] font-cinzel font-semibold text-slate-400 tracking-wider">REPERTORIO DE DADOS</span>
          <span id="rolling-status" class="text-[10px] font-mono-num text-amber-400/80 font-medium">LISTO</span>
        </div>

        <div class="grid grid-cols-4 gap-2.5 sm:gap-3">
          <!-- d4 -->
          <button data-dice="d4" class="dice-btn rounded-xl py-3 px-2 flex flex-col items-center justify-center gap-1 group">
            <svg class="w-5 h-5 text-emerald-400 transition-transform group-hover:scale-110" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <polygon points="12 3 2 21 22 21 12 3"/>
              <line x1="12" y1="3" x2="12" y2="21" stroke-dasharray="1 1"/>
            </svg>
            <span class="text-xs font-mono-num font-bold text-slate-300 group-hover:text-emerald-300">d4</span>
          </button>

          <!-- d6 -->
          <button data-dice="d6" class="dice-btn rounded-xl py-3 px-2 flex flex-col items-center justify-center gap-1 group">
            <svg class="w-5 h-5 text-blue-400 transition-transform group-hover:scale-110" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <rect x="3" y="3" width="18" height="18" rx="2"/>
              <circle cx="8" cy="8" r="1.2" fill="currentColor"/>
              <circle cx="16" cy="16" r="1.2" fill="currentColor"/>
              <circle cx="12" cy="12" r="1.2" fill="currentColor"/>
            </svg>
            <span class="text-xs font-mono-num font-bold text-slate-300 group-hover:text-blue-300">d6</span>
          </button>

          <!-- d8 -->
          <button data-dice="d8" class="dice-btn rounded-xl py-3 px-2 flex flex-col items-center justify-center gap-1 group">
            <svg class="w-5 h-5 text-cyan-400 transition-transform group-hover:scale-110" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <polygon points="12 2 21 12 12 22 3 12"/>
              <line x1="3" y1="12" x2="21" y2="12"/>
            </svg>
            <span class="text-xs font-mono-num font-bold text-slate-300 group-hover:text-cyan-300">d8</span>
          </button>

          <!-- d10 -->
          <button data-dice="d10" class="dice-btn rounded-xl py-3 px-2 flex flex-col items-center justify-center gap-1 group">
            <svg class="w-5 h-5 text-purple-400 transition-transform group-hover:scale-110" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <polygon points="12 2 22 10 12 22 2 10"/>
              <polyline points="2 10 12 14 22 10"/>
            </svg>
            <span class="text-xs font-mono-num font-bold text-slate-300 group-hover:text-purple-300">d10</span>
          </button>

          <!-- d12 -->
          <button data-dice="d12" class="dice-btn rounded-xl py-3 px-2 flex flex-col items-center justify-center gap-1 group">
            <svg class="w-5 h-5 text-pink-400 transition-transform group-hover:scale-110" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <polygon points="12 2 21 8 18 19 6 19 3 8"/>
            </svg>
            <span class="text-xs font-mono-num font-bold text-slate-300 group-hover:text-pink-300">d12</span>
          </button>

          <!-- d20 (Hero button) -->
          <button data-dice="d20" class="dice-btn rounded-xl py-3 px-2 flex flex-col items-center justify-center gap-1 group border-amber-500/30 bg-amber-950/20" style="--btn-glow: rgba(245, 158, 11, 0.45)">
            <svg class="w-5 h-5 text-amber-400 transition-transform group-hover:scale-115 group-hover:rotate-12 duration-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <polygon points="12 2 22 8 22 16 12 22 2 16 2 8"/>
              <polygon points="12 7 18 15 6 15"/>
            </svg>
            <span class="text-xs font-mono-num font-bold text-amber-400 group-hover:text-amber-200">d20</span>
          </button>

          <!-- d100 -->
          <button data-dice="d100" class="dice-btn rounded-xl py-3 px-2 flex flex-col items-center justify-center gap-1 group">
            <svg class="w-5 h-5 text-indigo-400 transition-transform group-hover:scale-110" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <circle cx="12" cy="12" r="9"/>
              <text x="12" y="15.5" font-size="8" font-family="monospace" font-weight="bold" text-anchor="middle" fill="currentColor">%</text>
            </svg>
            <span class="text-xs font-mono-num font-bold text-slate-300 group-hover:text-indigo-300">d100</span>
          </button>

          <!-- 2d6 (Twin dice) -->
          <button data-dice="2d6" class="dice-btn rounded-xl py-3 px-2 flex flex-col items-center justify-center gap-1 group">
            <div class="flex items-center gap-0.5 text-teal-400">
              <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="18" height="18" rx="2"/>
              </svg>
              <svg class="w-3.5 h-3.5 -ml-1 opacity-70" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="18" height="18" rx="2"/>
              </svg>
            </div>
            <span class="text-xs font-mono-num font-bold text-slate-300 group-hover:text-teal-300">2d6</span>
          </button>
        </div>
      </section>

      <!-- Roll History Bar -->
      <section class="border-t border-slate-800/80 pt-3">
        <div class="flex items-center justify-between mb-2">
          <span class="text-[10px] font-cinzel font-bold text-slate-400 uppercase tracking-widest">ÚLTIMAS TIRADAS</span>
          <button id="clear-history" class="text-[10px] font-mono-num text-slate-400 hover:text-slate-200 transition">Borrar</button>
        </div>
        <div id="history-list" class="flex gap-2 overflow-x-auto pb-1 scrollbar-none min-h-[42px] items-center text-xs">
          <div class="text-[11px] text-slate-400 italic">No hay tiradas recientes</div>
        </div>
      </section>
    </div>

    <!-- Footnote hint -->
    <div class="text-center mt-3 text-[11px] text-slate-400">
      Toca cualquier dado para invocar el azar • Si explota, se vuelve a rodar automáticamente
    </div>
  </main>

  <script>
    let isRolling = false;
    let lastRolledDice = null;
    let soundEnabled = true;
    let explodingEnabled = false;
    let historyRolls = [];

    // Web Audio API Synthesizer
    const AudioEngine = {
      ctx: null,

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      },

      playTick() {
        if (!soundEnabled) return;
        this.init();
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          
          osc.type = 'triangle';
          const baseFreq = 420 + Math.random() * 220;
          osc.frequency.setValueAtTime(baseFreq, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(baseFreq * 0.4, this.ctx.currentTime + 0.04);

          gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.04);

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start();
          osc.stop(this.ctx.currentTime + 0.04);
        } catch (e) {}
      },

      playLanding() {
        if (!soundEnabled) return;
        this.init();
        try {
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = 'sine';
          osc.frequency.setValueAtTime(260, now);
          osc.frequency.exponentialRampToValueAtTime(70, now + 0.15);

          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start(now);
          osc.stop(now + 0.15);
        } catch (e) {}
      },

      playCrit() {
        if (!soundEnabled) return;
        this.init();
        try {
          const now = this.ctx.currentTime;
          const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
          notes.forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();

            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now + idx * 0.08);

            gain.gain.setValueAtTime(0.2, now + idx * 0.08);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.08 + 0.45);

            osc.connect(gain);
            gain.connect(this.ctx.destination);

            osc.start(now + idx * 0.08);
            osc.stop(now + idx * 0.08 + 0.46);
          });
        } catch (e) {}
      },

      playFumble() {
        if (!soundEnabled) return;
        this.init();
        try {
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(140, now);
          osc.frequency.linearRampToValueAtTime(45, now + 0.55);

          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.55);

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start(now);
          osc.stop(now + 0.56);
        } catch (e) {}
      },

      playExplosion() {
        if (!soundEnabled) return;
        this.init();
        try {
          const now = this.ctx.currentTime;
          
          const bufferSize = this.ctx.sampleRate * 0.5;
          const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (this.ctx.sampleRate * 0.12));
          }

          const noise = this.ctx.createBufferSource();
          noise.buffer = buffer;

          const filter = this.ctx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(950, now);
          filter.frequency.exponentialRampToValueAtTime(80, now + 0.4);

          const noiseGain = this.ctx.createGain();
          noiseGain.gain.setValueAtTime(0.65, now);
          noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);

          noise.connect(filter);
          filter.connect(noiseGain);
          noiseGain.connect(this.ctx.destination);

          const subOsc = this.ctx.createOscillator();
          const subGain = this.ctx.createGain();
          subOsc.type = 'sine';
          subOsc.frequency.setValueAtTime(190, now);
          subOsc.frequency.exponentialRampToValueAtTime(30, now + 0.5);

          subGain.gain.setValueAtTime(0.65, now);
          subGain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);

          subOsc.connect(subGain);
          subGain.connect(this.ctx.destination);

          noise.start(now);
          subOsc.start(now);
          noise.stop(now + 0.5);
          subOsc.stop(now + 0.5);
        } catch (e) {}
      }
    };

    const canvas = document.getElementById('fx-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor(x, y, color, speed, size, isBurst) {
        this.x = x;
        this.y = y;
        this.color = color;
        this.size = Math.random() * size + 2;
        const angle = Math.random() * Math.PI * 2;
        const velocity = Math.random() * speed + 2;
        this.vx = Math.cos(angle) * velocity;
        this.vy = Math.sin(angle) * velocity - (isBurst ? 2 : 0);
        this.alpha = 1;
        this.decay = Math.random() * 0.02 + 0.015;
        this.gravity = isBurst ? 0.12 : 0.15;
        this.rotation = Math.random() * Math.PI;
        this.rotSpeed = (Math.random() - 0.5) * 0.25;
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += this.gravity;
        this.alpha -= this.decay;
        this.rotation += this.rotSpeed;
      }

      draw(c) {
        c.save();
        c.globalAlpha = Math.max(0, this.alpha);
        c.translate(this.x, this.y);
        c.rotate(this.rotation);
        c.fillStyle = this.color;
        c.fillRect(-this.size / 2, -this.size / 2, this.size, this.size);
        c.restore();
      }
    }

    function spawnParticles(type) {
      const rect = document.getElementById('result-stage').getBoundingClientRect();
      const originX = rect.left + rect.width / 2;
      const originY = rect.top + rect.height / 2;
      
      let count = 20;
      let palette = ['#e2e8f0', '#94a3b8'];
      let speed = 5;
      let size = 3;

      if (type === 'crit') {
        count = 90;
        palette = ['#f59e0b', '#fbbf24', '#ffffff', '#fde68a', '#eab308'];
        speed = 9;
        size = 6;
      } else if (type === 'fumble') {
        count = 45;
        palette = ['#ef4444', '#b91c1c', '#7f1d1d', '#1f2937'];
        speed = 6;
        size = 4;
      } else if (type === 'explosion') {
        count = 110;
        palette = ['#ea580c', '#f97316', '#fbbf24', '#ffffff', '#dc2626', '#ffedd5'];
        speed = 12;
        size = 7;
      }

      for (let i = 0; i < count; i++) {
        const color = palette[Math.floor(Math.random() * palette.length)];
        particles.push(new Particle(
          originX, 
          originY, 
          color, 
          speed, 
          size, 
          type === 'explosion' || type === 'crit'
        ));
      }
    }

    function triggerShockwaveEffect() {
      const stage = document.getElementById('result-stage');
      const wave = document.createElement('div');
      wave.className = 'shockwave';
      wave.style.left = '50%';
      wave.style.top = '50%';
      stage.appendChild(wave);

      setTimeout(() => {
        if (wave.parentNode) wave.remove();
      }, 800);
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.update();
        p.draw(ctx);
        if (p.alpha <= 0) {
          particles.splice(i, 1);
        }
      }
      requestAnimationFrame(animateParticles);
    }
    requestAnimationFrame(animateParticles);

    const appWrapper = document.getElementById('app-wrapper');
    const resultStage = document.getElementById('result-stage');
    const resultNumber = document.getElementById('result-number');
    const diceTypeTag = document.getElementById('dice-type-tag');
    const resultBreakdown = document.getElementById('result-breakdown');
    const rollingStatus = document.getElementById('rolling-status');
    const quickRerollBtn = document.getElementById('quick-reroll');
    const historyList = document.getElementById('history-list');
    const ambientGlow = document.getElementById('ambient-glow');
    const explodeToggleBtn = document.getElementById('explode-toggle');
    const explodeText = document.getElementById('explode-text');
    const allDiceButtons = document.querySelectorAll('.dice-btn');

    const DICE_MAX = {
      'd4': 4,
      'd6': 6,
      'd8': 8,
      'd10': 10,
      'd12': 12,
      'd20': 20,
      'd100': 100,
      '2d6': 6
    };

    function waitMs(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    function rollSingleDie(sides) {
      return Math.floor(Math.random() * sides) + 1;
    }

    function getRandomFastNumber(sides) {
      return Math.floor(Math.random() * sides) + 1;
    }

    function setButtonsDisabled(disabled) {
      allDiceButtons.forEach(btn => btn.disabled = disabled);
      quickRerollBtn.disabled = disabled;
    }

    function clearSpecialEffects() {
      resultStage.classList.remove('crit-glow-active', 'fumble-glow-active', 'explode-glow-active');
      resultStage.style.borderColor = '';
      ambientGlow.style.background = '';
      diceTypeTag.className = 'text-[11px] font-cinzel font-bold tracking-widest text-slate-400 uppercase mb-1 z-10 transition-colors';
      resultNumber.className = 'text-6xl sm:text-7xl font-mono-num font-black tracking-tight text-white transition-all duration-150 transform z-10';
    }

    function runShuffleAnimation(sides, steps = 14, interval = 45) {
      return new Promise(resolve => {
        resultNumber.classList.add('animate-jitter', 'text-amber-300');
        let count = 0;
        const timer = setInterval(() => {
          count++;
          resultNumber.textContent = getRandomFastNumber(sides);
          AudioEngine.playTick();

          if (count >= steps) {
            clearInterval(timer);
            resultNumber.classList.remove('animate-jitter', 'text-amber-300');
            const finalVal = rollSingleDie(sides);
            resolve(finalVal);
          }
        }, interval);
      });
    }

    function triggerExplosionVisuals() {
      AudioEngine.playExplosion();
      spawnParticles('explosion');
      triggerShockwaveEffect();

      resultStage.classList.remove('explode-glow-active');
      void resultStage.offsetWidth;
      resultStage.classList.add('explode-glow-active');

      resultNumber.classList.add('text-orange-400');
      diceTypeTag.className = 'text-[11px] font-cinzel font-bold tracking-widest text-orange-400 uppercase mb-1 z-10 transition-colors drop-shadow-[0_0_8px_rgba(249,115,22,0.8)]';
      ambientGlow.style.background = 'radial-gradient(circle at center, rgba(249, 115, 22, 0.55) 0%, transparent 70%)';

      appWrapper.classList.remove('animate-shake');
      void appWrapper.offsetWidth;
      appWrapper.classList.add('animate-shake');
    }

    function triggerCriticalHitVisuals() {
      AudioEngine.playCrit();
      spawnParticles('crit');

      resultStage.classList.add('crit-glow-active');
      resultNumber.classList.add('text-yellow-400');
      diceTypeTag.className = 'text-[11px] font-cinzel font-bold tracking-widest text-yellow-400 uppercase mb-1 z-10 transition-colors drop-shadow-[0_0_8px_rgba(245,158,11,0.8)]';
      ambientGlow.style.background = 'radial-gradient(circle at center, rgba(245, 158, 11, 0.45) 0%, transparent 70%)';

      appWrapper.classList.remove('animate-shake');
      void appWrapper.offsetWidth;
      appWrapper.classList.add('animate-shake');
    }

    function triggerFumbleVisuals() {
      AudioEngine.playFumble();
      spawnParticles('fumble');

      resultStage.classList.add('fumble-glow-active');
      resultNumber.classList.add('text-red-500');
      diceTypeTag.className = 'text-[11px] font-cinzel font-bold tracking-widest text-red-400 uppercase mb-1 z-10 transition-colors drop-shadow-[0_0_8px_rgba(239,68,68,0.8)]';
      ambientGlow.style.background = 'radial-gradient(circle at center, rgba(220, 38, 38, 0.45) 0%, transparent 70%)';

      appWrapper.classList.remove('animate-shake');
      void appWrapper.offsetWidth;
      appWrapper.classList.add('animate-shake');
    }

    async function executeSingleDiceRoll(diceType) {
      const sides = DICE_MAX[diceType];
      const maxChainLimit = 6;
      let rolls = [];
      let didExplode = false;

      // Initial roll animation
      diceTypeTag.textContent = `TIRANDO ${diceType.toUpperCase()}...`;
      rollingStatus.textContent = 'RODANDO';
      rollingStatus.classList.add('text-amber-400');

      const firstRoll = await runShuffleAnimation(sides, 15, 45);
      rolls.push(firstRoll);
      resultNumber.textContent = firstRoll;

      // Check immediate critical or fumble on D20 when not exploding
      if (diceType === 'd20' && firstRoll === 20 && !explodingEnabled) {
        triggerCriticalHitVisuals();
        diceTypeTag.textContent = '⚡ CRÍTICO (NAT 20) ⚡';
      } else if (diceType === 'd20' && firstRoll === 1) {
        triggerFumbleVisuals();
        diceTypeTag.textContent = '☠ PIFIA (NAT 1) ☠';
      } else if (firstRoll !== sides) {
        AudioEngine.playLanding();
        spawnParticles('normal');
      }

      // Chain explosions with sequential animated rerolls
      if (explodingEnabled && firstRoll === sides) {
        didExplode = true;
        let chainCount = 1;

        while (rolls[rolls.length - 1] === sides && chainCount <= maxChainLimit) {
          triggerExplosionVisuals();
          
          const currentTotal = rolls.reduce((a, b) => a + b, 0);
          diceTypeTag.textContent = chainCount > 1 ? `💥 EXPLOSIÓN x${chainCount}` : '💥 EXPLOSIÓN';
          resultBreakdown.textContent = `${rolls.join(' + ')} = ${currentTotal} (Tirando bonus...)`;
          resultBreakdown.style.opacity = '1';

          // Dramatic pause before bonus die starts spinning
          await waitMs(650);

          rollingStatus.textContent = 'REROLL';
          const bonusRoll = await runShuffleAnimation(sides, 14, 45);
          rolls.push(bonusRoll);
          chainCount++;

          const newTotal = rolls.reduce((a, b) => a + b, 0);
          resultNumber.textContent = newTotal;

          if (bonusRoll !== sides) {
            AudioEngine.playLanding();
            spawnParticles('normal');
          }
        }
      }

      const finalTotal = rolls.reduce((a, b) => a + b, 0);
      resultNumber.textContent = finalTotal;
      rollingStatus.textContent = 'LISTO';
      rollingStatus.classList.remove('text-amber-400');

      if (didExplode) {
        diceTypeTag.textContent = `💥 ${diceType.toUpperCase()} EXPLOSIVO`;
        resultBreakdown.textContent = `${rolls.join(' + ')} = ${finalTotal}`;
        resultBreakdown.style.opacity = '1';
      } else if (diceType !== 'd20' || (firstRoll !== 20 && firstRoll !== 1)) {
        diceTypeTag.textContent = `RESULTADO ${diceType.toUpperCase()}`;
      }

      return {
        total: finalTotal,
        hasExploded: didExplode,
        initialRoll: rolls[0]
      };
    }

    async function execute2d6Roll() {
      const sides = 6;
      const maxChainLimit = 5;
      diceTypeTag.textContent = `TIRANDO 2d6 (DADO 1)...`;
      rollingStatus.textContent = 'RODANDO D1';
      rollingStatus.classList.add('text-amber-400');

      // Roll Die 1
      let die1Rolls = [];
      const d1Initial = await runShuffleAnimation(sides, 14, 45);
      die1Rolls.push(d1Initial);
      resultNumber.textContent = d1Initial;
      resultBreakdown.textContent = `D1: [${d1Initial}] | D2: Esperando...`;
      resultBreakdown.style.opacity = '1';

      let d1Exploded = false;
      if (explodingEnabled && d1Initial === 6) {
        d1Exploded = true;
        let chain = 1;
        while (die1Rolls[die1Rolls.length - 1] === 6 && chain <= maxChainLimit) {
          triggerExplosionVisuals();
          diceTypeTag.textContent = '💥 D1 EXPLOTA (6)';
          resultBreakdown.textContent = `D1: [${die1Rolls.join('+')}] (Tirando bonus...) | D2: En espera`;
          await waitMs(650);

          rollingStatus.textContent = 'REROLL D1';
          const bonus = await runShuffleAnimation(sides, 13, 45);
          die1Rolls.push(bonus);
          chain++;
          resultNumber.textContent = die1Rolls.reduce((a, b) => a + b, 0);
          if (bonus !== 6) AudioEngine.playLanding();
        }
      } else {
        AudioEngine.playLanding();
      }

      await waitMs(400);

      // Roll Die 2
      diceTypeTag.textContent = `TIRANDO 2d6 (DADO 2)...`;
      rollingStatus.textContent = 'RODANDO D2';
      
      let die2Rolls = [];
      const d2Initial = await runShuffleAnimation(sides, 14, 45);
      die2Rolls.push(d2Initial);

      const d1Sum = die1Rolls.reduce((a, b) => a + b, 0);
      resultNumber.textContent = d1Sum + d2Initial;
      resultBreakdown.textContent = `D1: [${die1Rolls.join('+')}] + D2: [${d2Initial}]`;

      let d2Exploded = false;
      if (explodingEnabled && d2Initial === 6) {
        d2Exploded = true;
        let chain = 1;
        while (die2Rolls[die2Rolls.length - 1] === 6 && chain <= maxChainLimit) {
          triggerExplosionVisuals();
          diceTypeTag.textContent = '💥 D2 EXPLOTA (6)';
          resultBreakdown.textContent = `D1: [${die1Rolls.join('+')}] + D2: [${die2Rolls.join('+')}] (Tirando bonus...)`;
          await waitMs(650);

          rollingStatus.textContent = 'REROLL D2';
          const bonus = await runShuffleAnimation(sides, 13, 45);
          die2Rolls.push(bonus);
          chain++;
          const curD2Sum = die2Rolls.reduce((a, b) => a + b, 0);
          resultNumber.textContent = d1Sum + curD2Sum;
          if (bonus !== 6) AudioEngine.playLanding();
        }
      } else {
        AudioEngine.playLanding();
      }

      const sum1 = die1Rolls.reduce((a, b) => a + b, 0);
      const sum2 = die2Rolls.reduce((a, b) => a + b, 0);
      const total = sum1 + sum2;

      rollingStatus.textContent = 'LISTO';
      rollingStatus.classList.remove('text-amber-400');
      resultNumber.textContent = total;

      const hasExploded = d1Exploded || d2Exploded;
      if (hasExploded) {
        diceTypeTag.textContent = '💥 2d6 EXPLOSIVO';
        resultBreakdown.textContent = `D1:[${die1Rolls.join('+')}] + D2:[${die2Rolls.join('+')}] = ${total}`;
      } else {
        diceTypeTag.textContent = 'RESULTADO 2d6';
        resultBreakdown.textContent = `[${die1Rolls[0]}] + [${die2Rolls[0]}] = ${total}`;
      }
      resultBreakdown.style.opacity = '1';

      return {
        total,
        hasExploded,
        initialRoll: d1Initial + d2Initial
      };
    }

    async function rollDice(diceType) {
      if (isRolling) return;
      isRolling = true;
      lastRolledDice = diceType;
      setButtonsDisabled(true);

      clearSpecialEffects();
      resultBreakdown.style.opacity = '0';
      resultBreakdown.innerHTML = '&nbsp;';

      let rollResult;
      if (diceType === '2d6') {
        rollResult = await execute2d6Roll();
      } else {
        rollResult = await executeSingleDiceRoll(diceType);
      }

      quickRerollBtn.style.opacity = '1';
      quickRerollBtn.style.pointerEvents = 'auto';

      addHistoryEntry(diceType, rollResult.total, rollResult.hasExploded, rollResult.initialRoll);
      setButtonsDisabled(false);
      isRolling = false;
    }

    function addHistoryEntry(dice, total, hasExploded, initialRoll) {
      let badgeStyle = 'bg-slate-800 text-slate-300 border-slate-700';
      let icon = '';

      if (hasExploded) {
        badgeStyle = 'bg-orange-500/20 text-orange-300 border-orange-500/60 font-black shadow-[0_0_8px_rgba(249,115,22,0.4)]';
        icon = '💥';
      } else if (dice === 'd20' && initialRoll === 20) {
        badgeStyle = 'bg-amber-500/20 text-amber-300 border-amber-500/60 font-black shadow-[0_0_8px_rgba(245,158,11,0.3)]';
      } else if (dice === 'd20' && initialRoll === 1) {
        badgeStyle = 'bg-red-500/20 text-red-300 border-red-500/60 font-black shadow-[0_0_8px_rgba(239,68,68,0.3)]';
      }

      historyRolls.unshift({ dice, total, badgeStyle, icon });
      if (historyRolls.length > 5) {
        historyRolls.pop();
      }
      renderHistory();
    }

    function renderHistory() {
      if (historyRolls.length === 0) {
        historyList.innerHTML = `<div class="text-[11px] text-slate-400 italic">No hay tiradas recientes</div>`;
        return;
      }

      historyList.innerHTML = historyRolls.map(item => `
        <div class="flex-shrink-0 px-2.5 py-1 rounded-lg border text-xs font-mono-num flex items-center gap-1.5 ${item.badgeStyle}">
          <span class="opacity-70 text-[10px] uppercase font-bold">${item.dice}:</span>
          <span class="font-bold text-sm">${item.icon ? item.icon + ' ' : ''}${item.total}</span>
        </div>
      `).join('');
    }

    allDiceButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        const dice = btn.dataset.dice;
        rollDice(dice);
      });
    });

    quickRerollBtn.addEventListener('click', () => {
      if (lastRolledDice) rollDice(lastRolledDice);
    });

    document.getElementById('clear-history').addEventListener('click', () => {
      historyRolls = [];
      renderHistory();
    });

    const soundToggleBtn = document.getElementById('sound-toggle');
    const soundIcon = document.getElementById('sound-icon');
    const soundText = document.getElementById('sound-text');

    soundToggleBtn.addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      if (soundEnabled) {
        soundIcon.textContent = '🔊';
        soundText.textContent = 'ON';
        soundToggleBtn.classList.remove('opacity-50');
        AudioEngine.init();
      } else {
        soundIcon.textContent = '🔇';
        soundText.textContent = 'OFF';
        soundToggleBtn.classList.add('opacity-50');
      }
    });

    explodeToggleBtn.addEventListener('click', () => {
      explodingEnabled = !explodingEnabled;
      if (explodingEnabled) {
        explodeText.textContent = 'EXP ON';
        explodeText.className = 'text-[10px] font-bold tracking-wider text-orange-400';
        explodeToggleBtn.classList.add('border-orange-500/70', 'bg-orange-950/30', 'shadow-[0_0_12px_rgba(249,115,22,0.3)]');
        explodeToggleBtn.classList.remove('text-slate-400', 'border-slate-700/60');
      } else {
        explodeText.textContent = 'EXP OFF';
        explodeText.className = 'text-[10px] font-bold tracking-wider text-slate-400';
        explodeToggleBtn.classList.remove('border-orange-500/70', 'bg-orange-950/30', 'shadow-[0_0_12px_rgba(249,115,22,0.3)]');
        explodeToggleBtn.classList.add('text-slate-400', 'border-slate-700/60');
      }
    });
  </script>
</body>
